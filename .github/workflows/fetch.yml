name: Fetch outfits

on:
  schedule:
    - cron: "23 */2 * * *" # every 2 hours: the avatars page shows new results over time
  workflow_dispatch:
    inputs:
      per_gender:
        description: "Best outfits to keep per gender (male / female)"
        default: "1000"

permissions:
  contents: write

concurrency: fetch-outfits

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find and score outfits
        run: node fetch.mjs
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          PER_GENDER: ${{ github.event.inputs.per_gender || '1000' }}

      - name: Save to the repo
        if: always()
        run: |
          git config user.name "outfit-pool-bot"
          git config user.email "outfit-pool-bot@users.noreply.github.com"
          git add pool.json status.json candidates.json items.json seen.json debug
          git diff --cached --quiet && exit 0
          git commit -m "Update outfit pool"
          git pull --rebase
          git push
