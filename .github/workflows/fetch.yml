name: Fetch outfits

on:
  workflow_dispatch:
    inputs:
      target:
        description: "How many outfits to keep in the pool"
        default: "2000"
      keywords:
        description: "Optional: your own comma-separated keywords (leave empty for the built-in emo/goth list)"
        default: ""

permissions:
  contents: write

concurrency: fetch-outfits

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch outfits from the avatars page
        run: node fetch.mjs
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          POOL_TARGET: ${{ github.event.inputs.target }}
          KEYWORDS: ${{ github.event.inputs.keywords }}

      - name: Save the pool to the repo
        run: |
          git config user.name "outfit-pool-bot"
          git config user.email "outfit-pool-bot@users.noreply.github.com"
          git add pool.json status.json debug
          git diff --cached --quiet || git commit -m "Update outfit pool"
          git push
